name: Temporary Bluetooth SSP diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile temporary Android script
        shell: bash
        run: |
          sdk_jar=$(ls "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)
          dex_tool=$(ls "$ANDROID_HOME"/build-tools/*/d8 | sort -V | tail -1)
          mkdir -p /tmp/probe-dex
          javac -source 8 -target 8 -bootclasspath "$sdk_jar" -d /tmp diagnostics/BluetoothProbe.java
          "$dex_tool" --min-api 28 --lib "$sdk_jar" --output /tmp/probe-dex /tmp/BluetoothProbe.class
          jar cf BluetoothProbe.jar -C /tmp/probe-dex classes.dex
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Bluetooth-SSP-probe
          path: BluetoothProbe.jar
